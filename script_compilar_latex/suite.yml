# script_compilar_latex/suite.yml — suite compilar_latex: Compila un .tex suelto (no de un framework) desde cualquier ruta; LuaLaTeX por defecto, Biber con --biber; alias `compilar`.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: compilar_latex
objetivo: latex
resumen: 'Compila un .tex suelto (no de un framework) desde cualquier ruta; LuaLaTeX por defecto, Biber con --biber; alias `compilar`.'
escribe_en:
- archivos
simula_por_defecto: false
comandos:
- main.sh -e lualatex --biber documento
- main.sh --dry-run -e lualatex --biber documento
- main.sh --limpiar documento
- main.sh --help
estado: activo
interfaz: cli
entrada: 'un .tex en cualquier carpeta; el PDF y los auxiliares se escriben junto a él (o el PDF en -o DIR)'
depende_de:
- lualatex
- biber
- core/shell-lib
nota: '--dry-run (-n) simula sin escribir nada; prueba de suite: tests/dry-run.sh (RQ-COD-02)'

# studio/suite.yml — suite latex_studio: LaTeX Studio, el entorno de escritura científica (QML + Kirigami sobre gui-comun 2.x).
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: latex_studio
objetivo: latex
resumen: 'Entorno de escritura científica (QML + Kirigami sobre gui-comun 2.x): detecta los proyectos LaTeX de las carpetas de trabajo (WRITING_DIR, DESPACHO_DIR y las que se añadan), los compila con su compilador y su motor (el del marco, latexmk o main.sh; LuaLaTeX + Biber sin declaración), en cola; editor con resaltado, estructura, autocompletado de \ref y \cite, buscar y reemplazar; PDF integrado con pdftoppm y SyncTeX; problemas con causa y acción.'
escribe_en:
- archivos
simula_por_defecto: false
pruebas: latex-studio/tests/run.sh   # desde ~/Documents; los proyectos de muestra del repo compilados en un temporal (lualatex, biber, latexmk, synctex, pdftoppm si están), cada QML y --smoke con /usr/bin/python3
comandos:
- main.py [documento.tex]   # ejecutable; su intérprete es /usr/bin/python3 (el Qt del sistema, con Kirigami)
- main.py --smoke
- ../install.sh
estado: activo
interfaz: gui
depende_de:
- /usr/bin/python3 con PySide6 del sistema (python3-pyside6.*) y Kirigami (qml6-module-org-kde-kirigami)
- gui-comun 2.3 (módulo QML GuiComun)
- script_compilar_latex
- poppler-utils (pdftoppm, pdfinfo) y synctex para el visor; latexmk para los proyectos con latexmkrc
nota: 'No compila por su cuenta: cada proyecto con su compilador (el scripts/build.sh de su marco, latexmk si tiene latexmkrc, o script_compilar_latex/main.sh -k); nunca escribe fuentes salvo Ctrl+S en el editor; no ofrece pdfLaTeX ni XeLaTeX a un proyecto que no los declare (regla 6). Las carpetas de trabajo del usuario van a sus ajustes, nunca al repo.'

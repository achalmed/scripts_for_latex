# studio/suite.yml — suite latex_studio: la ventana (QML + Kirigami sobre gui-comun 2.x) del compilador del .tex suelto.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: latex_studio
objetivo: latex
resumen: 'Ventana del compilador del .tex suelto (QML + Kirigami sobre gui-comun 2.x): los documentos de una carpeta con su estado, LuaLaTeX + Biber por main.sh (F5 compila, Mayús+F5 simula, Ctrl+B con Biber), cada error y aviso con su línea, el registro íntegro, el PDF y los auxiliares, recompilar al guardar y el historial.'
escribe_en:
- archivos
simula_por_defecto: false
pruebas: latex-studio/tests/run.sh   # desde ~/Documents; el ejemplo del repo compilado en un temporal (lualatex y biber si están), cada QML y --smoke con /usr/bin/python3
comandos:
- main.py [documento.tex]   # ejecutable; su intérprete es /usr/bin/python3 (el Qt del sistema, con Kirigami)
- main.py --smoke
- ../install.sh
estado: activo
interfaz: gui
depende_de:
- /usr/bin/python3 con PySide6 del sistema (python3-pyside6.*) y Kirigami (qml6-module-org-kde-kirigami)
- gui-comun 2.3 (módulo QML GuiComun)
- script_compilar_latex
nota: 'No compila por su cuenta: arma la orden de script_compilar_latex/main.sh y lee su registro; la ventana no ofrece pdfLaTeX ni XeLaTeX (regla 6).'

# studio/suite.yml — suite latex_studio: Aplicación de escritorio (PySide6) sobre el compilador del .tex suelto: opciones, errores con su línea, recompilar al guardar e historial.
# Contrato: core/suite.schema.yml; core/suites.py validar lo comprueba y generar escribe los índices y README.
id: latex_studio
objetivo: latex
resumen: 'Aplicación de escritorio (PySide6) sobre el compilador del .tex suelto: opciones, errores con su línea, recompilar al guardar e historial.'
escribe_en:
- archivos
simula_por_defecto: false
pruebas: python3 -m pytest -q tests   # desde la raíz del repo: la ventana sin pantalla, una compilación real en un temporal y la lectura del .log
comandos:
- main.py [archivo.tex]
- main.py --smoke
estado: activo
interfaz: gui
depende_de:
- PySide6
- script_compilar_latex

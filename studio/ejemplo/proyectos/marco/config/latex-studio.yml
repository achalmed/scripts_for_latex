# config/latex-studio.yml — el esquema del marco de muestra: qué puede configurar LaTeX Studio en sus documentos
# (contrato: docs/configuracion-de-documentos.md). Lo usan las pruebas y las capturas; ningún dato real.
version: 1
marco: muestra
datos:                             # §8 del contrato: lo que los informes del marco pueden citar de sus paquetes de datos
  nombre: Datos de muestra
  marcador: datos.yml
  recursos: [python3, ../scripts/datos_muestra.py, recursos, '{proyecto}']
  actualizar: [python3, ../scripts/datos_muestra.py, actualizar, '{proyecto}']
biblioteca:                        # §9 del contrato: buscar y citar libros, las fichas del proyecto
  nombre: Biblioteca de muestra
  marcador: datos.yml
  buscar: [python3, ../scripts/datos_muestra.py, buscar, '{texto}']
  fichas: [python3, ../scripts/datos_muestra.py, fichas, '{proyecto}']
  citar: [python3, ../scripts/datos_muestra.py, citar, '{proyecto}', '{id}']
  formulario: [python3, ../scripts/datos_muestra.py, formulario]
  ficha: [python3, ../scripts/datos_muestra.py, ficha, '{proyecto}', '{archivo}']
  nueva_ficha: [python3, ../scripts/datos_muestra.py, nueva_ficha, '{proyecto}', '{datos}']
  guardar_ficha: [python3, ../scripts/datos_muestra.py, guardar_ficha, '{proyecto}', '{archivo}', '{huella}', '{datos}']
ayuda:                             # §10 del contrato: el prompt de la parte abierta y lo que respondió el chat
  nombre: Ayuda de la IA (muestra)
  marcador: datos.yml
  prompt: [python3, ../scripts/datos_muestra.py, prompt, '{proyecto}', '{archivo}']
  pegar: [python3, ../scripts/datos_muestra.py, pegar, '{proyecto}', '{archivo}', '{pegado}', --tex, '{tex}']
  revisar_prompt: [python3, ../scripts/flujo_muestra.py, revisar-prompt, '{prompt}']   # antes de copiar (C12.3, §1.22)
entrega:                           # §12 del contrato: los controles antes de entregar, marcar lo manual y registrar la IA
  nombre: Antes de entregar
  marcador: datos.yml
  revisar: [python3, ../scripts/entrega_muestra.py, revisar, '{proyecto}']
  marcar: [python3, ../scripts/entrega_muestra.py, marcar, '{proyecto}', '{id}', '{estado}', '{nota}']
  registrar_ia: [python3, ../scripts/entrega_muestra.py, registrar_ia, '{proyecto}', '{datos}']
  rubrica: [python3, ../scripts/flujo_muestra.py, rubrica, '{proyecto}']                   # la autoevaluación (§1.22)
  autoevaluar: [python3, ../scripts/flujo_muestra.py, autoevaluar, '{proyecto}', '{datos}']
  lector_frio: [python3, ../scripts/flujo_muestra.py, lector-frio, '{proyecto}']             # la versión sin nombres (§1.22)
matriz:                            # §13 del contrato: la matriz de consistencia y el asistente de pregunta
  nombre: Matriz de consistencia
  marcador: datos.yml
  leer: [python3, ../scripts/flujo_muestra.py, matriz-leer, '{proyecto}']
  cuadro: [python3, ../scripts/flujo_muestra.py, matriz-cuadro, '{proyecto}']
  nueva: [python3, ../scripts/flujo_muestra.py, matriz-nueva, '{proyecto}']
  guia: [python3, ../scripts/flujo_muestra.py, matriz-guia]
  pregunta: [python3, ../scripts/flujo_muestra.py, matriz-pregunta, '{proyecto}', '{datos}']
revisor:                           # §14 del contrato: estilo y LaTeX del archivo abierto
  marcador: datos.yml
  revisar: [python3, ../scripts/flujo_muestra.py, revisor, '{archivo}', '{ruta}']
  reglas: [python3, ../scripts/flujo_muestra.py, reglas]
plantillas:                        # §15 del contrato: las plantillas que ahorran tiempo
  marcador: datos.yml
  listar: [python3, ../scripts/flujo_muestra.py, plantillas]
  componer: [python3, ../scripts/flujo_muestra.py, componer, '{datos}']
nuevo:                             # §11 del contrato: los tipos que se pueden crear y crearlos (simula sin --aplicar)
  nombre: Marco de muestra
  tipos: [python3, ../scripts/nuevo_muestra.py, tipos]
  crear: [python3, ../scripts/nuevo_muestra.py, crear, '{datos}']
documentos:
  - nombre: Memoria
    clases: [memoria]
    versiones:                     # dos versiones de un mismo .tex (scripts/build.sh --version; §7 del contrato)
      comentario: VERSION
      argumento: --version
      omision: completa
      lista:
        - {clave: completa, nombre: Completa, job: "{nombre}"}
        - {clave: resumen, nombre: Resumen, job: "{nombre}-resumen"}
    secciones:
      - titulo: Datos del documento
        icono: document-properties
        descripcion: Lo que imprime la cabecera de la memoria.
        campos:
          - {clave: organizacion, etiqueta: Organización, tipo: texto, destino: {orden: '\organizacion'}}
          - {clave: responsable, etiqueta: Responsable, tipo: texto, ayuda: Nombre y cargo., destino: {orden: '\responsable'}}
          - {clave: logo, etiqueta: Logo, tipo: archivo, destino: {orden: '\logo'}}
      - titulo: Elementos visibles
        icono: view-visible
        campos:
          - {clave: mostrarlogo, etiqueta: Mostrar el logo, tipo: interruptor, omision: true, destino: {lista: '\configuracion', clave: logo}}
          - {clave: mostrarfecha, etiqueta: Mostrar la fecha, tipo: interruptor, omision: true, destino: {lista: '\configuracion', clave: fecha}}
      - titulo: Salida
        icono: document-print
        campos:
          - {clave: dos, etiqueta: Dos columnas, tipo: interruptor, omision: false, destino: {opcion_clase: twocolumn}}

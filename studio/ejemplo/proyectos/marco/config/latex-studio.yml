# config/latex-studio.yml — el esquema del marco de muestra: qué puede configurar LaTeX Studio en sus documentos
# (contrato: docs/configuracion-de-documentos.md). Lo usan las pruebas y las capturas; ningún dato real.
version: 1
marco: muestra
datos:                             # §8 del contrato: lo que los informes del marco pueden citar de sus paquetes de datos
  nombre: Datos de muestra
  marcador: datos.yml
  recursos: [python3, ../scripts/datos_muestra.py, recursos, '{proyecto}']
  actualizar: [python3, ../scripts/datos_muestra.py, actualizar, '{proyecto}']
biblioteca:                        # §9 del contrato: buscar y citar libros, las fichas del proyecto
  nombre: Biblioteca de muestra
  marcador: datos.yml
  buscar: [python3, ../scripts/datos_muestra.py, buscar, '{texto}']
  fichas: [python3, ../scripts/datos_muestra.py, fichas, '{proyecto}']
  citar: [python3, ../scripts/datos_muestra.py, citar, '{proyecto}', '{id}']
documentos:
  - nombre: Memoria
    clases: [memoria]
    versiones:                     # dos versiones de un mismo .tex (scripts/build.sh --version; §7 del contrato)
      comentario: VERSION
      argumento: --version
      omision: completa
      lista:
        - {clave: completa, nombre: Completa, job: "{nombre}"}
        - {clave: resumen, nombre: Resumen, job: "{nombre}-resumen"}
    secciones:
      - titulo: Datos del documento
        icono: document-properties
        descripcion: Lo que imprime la cabecera de la memoria.
        campos:
          - {clave: organizacion, etiqueta: Organización, tipo: texto, destino: {orden: '\organizacion'}}
          - {clave: responsable, etiqueta: Responsable, tipo: texto, ayuda: Nombre y cargo., destino: {orden: '\responsable'}}
          - {clave: logo, etiqueta: Logo, tipo: archivo, destino: {orden: '\logo'}}
      - titulo: Elementos visibles
        icono: view-visible
        campos:
          - {clave: mostrarlogo, etiqueta: Mostrar el logo, tipo: interruptor, omision: true, destino: {lista: '\configuracion', clave: logo}}
          - {clave: mostrarfecha, etiqueta: Mostrar la fecha, tipo: interruptor, omision: true, destino: {lista: '\configuracion', clave: fecha}}
      - titulo: Salida
        icono: document-print
        campos:
          - {clave: dos, etiqueta: Dos columnas, tipo: interruptor, omision: false, destino: {opcion_clase: twocolumn}}
